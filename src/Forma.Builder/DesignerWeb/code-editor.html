<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>Custom Properties editor</title>
<link rel="stylesheet" href="code-editor.css" />
</head>
<body>
<div class="editor-shell">
  <div class="editor-titlebar">
    <nav class="editor-tabs" role="tablist" aria-label="Source files">
      <button role="tab" id="tab-css" aria-controls="editor-css" data-tab="css"><b class="file-kind css-kind" aria-hidden="true">#</b><span>component.css</span><i class="file-dirty" aria-label="Unsaved changes" hidden></i></button>
      <button role="tab" id="tab-behavior" aria-controls="editor-behavior" data-tab="behavior"><b class="file-kind js-kind" aria-hidden="true">JS</b><span>script.js</span><i class="file-dirty" aria-label="Unsaved changes" hidden></i></button>
      <button role="tab" id="tab-characteristics" aria-controls="editor-characteristics" data-tab="characteristics"><b class="file-kind json-kind" aria-hidden="true">{}</b><span>custom-properties.json</span><i class="file-dirty" aria-label="Unsaved changes" hidden></i></button>
    </nav>
    <div class="editor-actions">
      <button class="editor-primary" data-command="save" title="Save all and apply (Ctrl+S)" aria-label="Save all and apply">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M15.2 3a2 2 0 0 1 1.4.6l3.8 3.8a2 2 0 0 1 .6 1.4V19a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2z"/><path d="M17 21v-7a1 1 0 0 0-1-1H8a1 1 0 0 0-1 1v7"/><path d="M7 3v4a1 1 0 0 0 1 1h7"/></svg>
      </button>
      <button data-command="format" title="Format document (Ctrl+Shift+F)" aria-label="Format document">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="m21.64 3.64-1.28-1.28a1.21 1.21 0 0 0-1.72 0L2.36 18.64a1.21 1.21 0 0 0 0 1.72l1.28 1.28a1.2 1.2 0 0 0 1.72 0L21.64 5.36a1.2 1.2 0 0 0 0-1.72"/><path d="m14 7 3 3"/><path d="M5 6v4"/><path d="M19 14v4"/><path d="M10 2v2"/><path d="M7 8H3"/><path d="M21 16h-4"/><path d="M11 3H9"/></svg>
      </button>
      <details class="editor-tools">
        <summary title="More actions" aria-label="More actions">
          <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="1"/><circle cx="19" cy="12" r="1"/><circle cx="5" cy="12" r="1"/></svg>
        </summary>
        <div class="editor-tools-menu">
          <button data-command="external">Open in external editor</button>
          <button data-command="choose-editor">Choose external editor…</button>
          <hr />
          <label class="editor-option"><input type="checkbox" id="format-on-save" checked /><span>Format on save</span></label>
        </div>
      </details>
      <button data-command="close" title="Close code editor" aria-label="Close code editor">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M18 6 6 18"/><path d="m6 6 12 12"/></svg>
      </button>
    </div>
  </div>
  <header class="editor-header">
    <div class="editor-location">
      <h1 id="editor-component-name">Component</h1>
      <svg class="location-divider" viewBox="0 0 24 24" aria-hidden="true"><path d="m9 18 6-6-6-6"/></svg>
      <i class="crumb-kind" aria-hidden="true"></i><span id="editor-file-name">component.css</span>
    </div>
  </header>
  <main class="editor-workspace">
    <div id="editor-css" class="editor-document" role="tabpanel" aria-labelledby="tab-css"></div>
    <div id="editor-behavior" class="editor-document" role="tabpanel" aria-labelledby="tab-behavior" hidden></div>
    <div id="editor-characteristics" class="editor-document" role="tabpanel" aria-labelledby="tab-characteristics" hidden></div>
  </main>
  <footer class="editor-footer">
    <span class="status-brand" aria-hidden="true">◈ Forma</span>
    <button id="editor-problems" data-command="problems" title="Show problems for the active file"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="10"/><path d="m15 9-6 6"/><path d="m9 9 6 6"/></svg><span>0 problems</span></button>
    <span id="editor-message" role="status">Loading editor…</span>
    <span id="editor-cursor"></span>
    <span id="editor-indent">Spaces: 2</span>
    <span id="editor-encoding">UTF-8</span>
    <span id="editor-language"></span>
    <span id="editor-dirty">Saved</span>
  </footer>
</div>
<script src="code-editor.bundle.js"></script>
</body>
</html>
